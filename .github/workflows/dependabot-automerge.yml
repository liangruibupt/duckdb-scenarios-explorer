name: Dependabot auto-merge

# CI 在 Dependabot PR 上跑成功后再来合并。没用分支保护 + gh pr merge --auto：
# 私有仓库在免费版上设不了，公开仓库设了会挡住直接 push 到默认分支。
# workflow_run 用的是默认分支上的这份文件和脚本，不会执行 PR 里的代码。
on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions: {}

jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Merge if the bump is compatible
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "skip: 这次 CI 没有关联的 PR" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,author,baseRefName,headRefName,headRefOid,title,commits > "$RUNNER_TEMP/pr.json"
          decision=$(node .github/scripts/dependabot-automerge.mjs "$RUNNER_TEMP/pr.json" "$HEAD_SHA" "$DEFAULT_BRANCH")
          echo "PR #$PR_NUMBER $decision" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$decision" in
            merge:*)
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
                --match-head-commit "$HEAD_SHA"
              ;;
          esac
