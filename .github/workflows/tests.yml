name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run offline + planner tests
        # data-gated (01, 04-exec) auto-skip without the Parquet; s3-gated (02)
        # auto-skips unless RUN_S3_TESTS=1. This job runs the always-on tier.
        run: pytest -q
