name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 这个 job 只需要读代码
permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # prefer prebuilt wheels and retry: a pypi timeout must not fall back
          # to compiling pandas/numpy from source (Cython build breaks on CI).
          pip install --only-binary=:all: --retries 5 --timeout 60 -r requirements.txt
      - name: Run offline + planner tests
        # data-gated (01, 04-exec) auto-skip without the Parquet; s3-gated (02)
        # auto-skips unless RUN_S3_TESTS=1. This job runs the always-on tier.
        run: pytest -q
      - name: Test the Dependabot auto-merge policy
        run: node --test .github/scripts/*.test.mjs
